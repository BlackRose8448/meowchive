<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meowchive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M22 20 L32 42 Q50 32 68 42 L78 20 L70 44 Q88 58 82 78 Q70 92 50 92 Q30 92 18 78 Q12 58 30 44 Z' fill='%23b26bff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root, [data-theme="dark"]{
    --bg:#0a0a12; --bg2:#0f0f1c; --panel:#14142380; --card:#171726; --card-hover:#1d1d30;
    --line:#2a2a42; --accent:#b26bff; --accent2:#ff6bd6; --accent3:#6be0ff;
    --text:#ece9f5; --text-dim:#9691b0; --green:#6fe6a0; --amber:#ffb26b; --radius:16px;
    --shadow:0 12px 28px rgba(178,107,255,.14);
    --orb1:rgba(178,107,255,.18); --orb2:rgba(255,107,214,.14); --orb3:rgba(107,224,255,.10);
  }
  [data-theme="light"]{
    --bg:#f6f3ff; --bg2:#efeaff; --panel:#ffffffcc; --card:#ffffff; --card-hover:#faf8ff;
    --line:#ddd5f0; --accent:#8b4dff; --accent2:#e84db8; --accent3:#1aa8d4;
    --text:#1e1830; --text-dim:#6f6685; --green:#1a9e5c; --amber:#c77720; --radius:16px;
    --shadow:0 12px 28px rgba(120,80,180,.12);
    --orb1:rgba(178,107,255,.12); --orb2:rgba(255,107,214,.10); --orb3:rgba(107,224,255,.08);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); min-height:100%; transition:background .25s,color .25s; }
  html[lang="fa"] body, html[dir="rtl"] body{ font-family:'Vazirmatn','Space Grotesk',system-ui,sans-serif; }
  body{
    font-family:'Space Grotesk','Poppins',system-ui,sans-serif;
    background:
      radial-gradient(circle at 12% 8%, var(--orb1), transparent 42%),
      radial-gradient(circle at 88% 12%, var(--orb2), transparent 40%),
      radial-gradient(circle at 50% 92%, var(--orb3), transparent 45%),
      var(--bg);
    background-size:180% 180%,180% 180%,180% 180%,auto;
    animation:bgdrift 26s ease-in-out infinite alternate;
    padding:20px 16px 70px; position:relative; overflow-x:hidden; min-height:100vh;
  }
  @keyframes bgdrift{
    0%{background-position:0% 0%,100% 0%,50% 100%,0 0;}
    100%{background-position:18% 14%,82% 22%,42% 78%,0 0;}
  }
  ::selection{ background:var(--accent); color:#0a0a12; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--accent); }

  /* soft floating light orbs */
  .orbs{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .orbs i{
    position:absolute; border-radius:50%; filter:blur(28px); opacity:.55;
    animation:orbfloat 18s ease-in-out infinite alternate;
  }
  .orbs i:nth-child(1){ width:160px; height:160px; background:var(--accent); top:12%; left:8%; animation-duration:22s; }
  .orbs i:nth-child(2){ width:120px; height:120px; background:var(--accent2); top:55%; right:10%; animation-duration:19s; animation-delay:-4s; }
  .orbs i:nth-child(3){ width:90px; height:90px; background:var(--accent3); bottom:18%; left:35%; animation-duration:24s; animation-delay:-8s; }
  @keyframes orbfloat{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(18px,-22px) scale(1.08); }
  }

  .paws-layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .paws-layer .paw{
    position:absolute; bottom:-50px; opacity:0; color:var(--accent);
    animation:paw-float linear infinite;
    width:22px; height:22px;
  }
  .paws-layer .paw svg{ width:100%; height:100%; display:block; }
  @keyframes paw-float{
    0%{transform:translateY(0) rotate(-8deg); opacity:0;}
    12%{opacity:.22;}
    88%{opacity:.12;}
    100%{transform:translateY(-110vh) rotate(18deg); opacity:0;}
  }

  .gate{
    position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    background:var(--bg); flex-direction:column; gap:22px; text-align:center; padding:20px;
  }
  .gate .gate-cat{
    width:90px; height:90px; filter:drop-shadow(0 0 22px rgba(178,107,255,.55));
    position:relative; z-index:2;
  }
  .gate .gate-cat.idle{ animation:catbounce 2.4s ease-in-out infinite; }
  .gate-cat .eye{ transform-origin:center; animation:blink 5s ease-in-out infinite; }
  @keyframes catbounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  @keyframes blink{
    0%,92%,100%{ transform:scaleY(1); }
    94%,96%{ transform:scaleY(0.12); }
  }
  .gate-cat.drop-bounce{
    animation: catRollIn 2.8s cubic-bezier(.19,1,.22,1) forwards;
  }
  @keyframes catRollIn{
    0%{ transform:translateX(-160vw) rotate(0deg); filter:drop-shadow(0 0 8px rgba(178,107,255,.25)); }
    70%{ transform:translateX(0) rotate(720deg); filter:drop-shadow(0 8px 16px rgba(178,107,255,.45)); }
    82%{ transform:translateX(0) translateY(-7px) rotate(720deg) scale(1.05,.95); }
    92%{ transform:translateX(0) translateY(2px) rotate(720deg) scale(.98,1.02); }
    100%{ transform:translateX(0) translateY(0) rotate(720deg) scale(1); filter:drop-shadow(0 0 28px rgba(178,107,255,.65)); }
  }
  .meow-pop{
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
    font-weight:800; font-size:16px; color:var(--accent2);
    text-shadow:0 0 14px rgba(255,107,214,.7), 0 0 28px rgba(178,107,255,.4);
    pointer-events:none; opacity:0; z-index:3;
    font-family:'Poppins','Vazirmatn',sans-serif; letter-spacing:.5px;
  }
  .meow-pop.show{ animation: meowPop .65s ease-out forwards; }
  @keyframes meowPop{
    0%{ opacity:0; transform:translate(-50%,-10%) scale(.5) rotate(-8deg); }
    30%{ opacity:1; transform:translate(-50%,-85%) scale(1.25) rotate(4deg); }
    100%{ opacity:0; transform:translate(-50%,-140%) scale(.85) rotate(0deg); }
  }
  .welcome-cat-wrap{
    position:relative; width:120px; height:120px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .welcome-cat-wrap .gate-cat{ width:110px; height:110px; }
  .welcome-ripple{
    position:absolute; left:50%; bottom:2px; width:20px; height:8px;
    border-radius:50%; background:rgba(178,107,255,.0);
    transform:translateX(-50%); pointer-events:none; z-index:1;
  }
  .welcome-ripple.burst{ animation: rippleBurst .55s ease-out forwards; }
  @keyframes rippleBurst{
    0%{ width:16px; height:6px; opacity:.7; background:rgba(178,107,255,.45); box-shadow:0 0 0 0 rgba(178,107,255,.35); }
    100%{ width:120px; height:28px; opacity:0; box-shadow:0 0 24px 8px rgba(178,107,255,0); }
  }
  .welcome-sparks{
    position:absolute; inset:-40px; pointer-events:none; overflow:hidden; z-index:0;
  }
  .welcome-sparks i{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:var(--accent); opacity:0;
    box-shadow:0 0 8px var(--accent2);
    animation: sparkFly 1.2s ease-out forwards;
  }
  @keyframes sparkFly{
    0%{ opacity:0; transform:translate(0,0) scale(.4); }
    20%{ opacity:.9; }
    100%{ opacity:0; transform:translate(var(--sx), var(--sy)) scale(0); }
  }
  #welcomeScreen{
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(178,107,255,.2), transparent 55%),
      radial-gradient(circle at 50% 45%, rgba(255,107,214,.08), transparent 40%),
      var(--bg);
  }
  #welcomeScreen .welcome-title{
    font-size:clamp(32px, 7vw, 48px);
    background:linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
    background-size:220% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: fadein .7s ease 1.7s both, titleShine 4s linear 2.2s infinite;
  }
  @keyframes titleShine{
    0%{ background-position:0% center; }
    100%{ background-position:220% center; }
  }
  #welcomeScreen .welcome-sub{ font-size:15px; letter-spacing:.2px; max-width:360px; }
  #welcomeScreen .welcome-enter{
    padding:14px 36px; font-size:15px;
    box-shadow:0 8px 28px rgba(178,107,255,.35);
    position:relative; overflow:hidden;
  }
  #welcomeScreen .welcome-enter::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,.25), transparent 70%);
    transform:translateX(-120%);
    animation: btnSheen 2.8s ease-in-out 2.5s infinite;
  }
  @keyframes btnSheen{
    0%,100%{ transform:translateX(-120%); }
    50%{ transform:translateX(120%); }
  }
  #welcomeScreen .welcome-enter:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 12px 36px rgba(178,107,255,.5);
  }
  /* ===== cinematic intro ===== */
  #welcomeScreen.intro{
    background:#05050c;
    padding:0; gap:0;
  }
  .intro-canvas{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:0; display:block;
  }
  .intro-vignette{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, transparent 0%, rgba(5,5,12,.55) 70%, rgba(5,5,12,.92) 100%),
      linear-gradient(180deg, rgba(178,107,255,.07), transparent 30%, transparent 70%, rgba(255,107,214,.06));
  }
  .intro-stage{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; padding:24px 16px; min-height:100vh; width:100%;
  }
  .intro-ring{
    position:absolute; top:42%; left:50%; width:180px; height:180px;
    margin:-90px 0 0 -90px; border-radius:50%;
    border:1px solid rgba(178,107,255,.25);
    box-shadow:0 0 40px rgba(178,107,255,.12), inset 0 0 40px rgba(178,107,255,.06);
    opacity:0; transform:scale(.4);
    animation: ringIn 1.1s ease .15s forwards, ringSpin 18s linear 1.2s infinite;
  }
  .intro-ring-2{
    width:260px; height:260px; margin:-130px 0 0 -130px;
    border-color:rgba(255,107,214,.18);
    animation: ringIn 1.2s ease .35s forwards, ringSpin 28s linear 1.4s infinite reverse;
  }
  @keyframes ringIn{
    to{ opacity:1; transform:scale(1); }
  }
  @keyframes ringSpin{ to{ transform:scale(1) rotate(360deg); } }
  #welcomeScreen.intro .welcome-cat-wrap{
    width:130px; height:130px; z-index:3;
  }
  #welcomeScreen.intro .welcome-cat-wrap .gate-cat{
    width:120px; height:120px;
    filter:drop-shadow(0 0 24px rgba(178,107,255,.7)) drop-shadow(0 0 60px rgba(255,107,214,.35));
  }
  .intro-brand{ position:relative; z-index:3; max-width:560px; }
  .intro-line{
    width:0; height:2px; margin:0 auto 16px;
    background:linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    border-radius:2px;
    animation: lineGrow .8s ease 1.5s forwards;
  }
  @keyframes lineGrow{ to{ width:min(220px, 50vw); } }
  #welcomeScreen.intro .intro-title{
    display:flex; flex-direction:column; gap:4px; align-items:center;
    margin:0; font-size:clamp(18px, 3.5vw, 22px); font-weight:600;
    opacity:0; animation:fadeUp .8s ease 1.55s forwards;
  }
  #welcomeScreen.intro .intro-title .t-word{
    color:var(--text-dim); font-weight:500; letter-spacing:.12em; text-transform:uppercase;
    font-size:clamp(11px, 2.2vw, 13px);
    background:none; -webkit-text-fill-color:var(--text-dim);
  }
  #welcomeScreen.intro .intro-title .t-name{
    font-family:'Poppins','Vazirmatn',sans-serif; font-weight:800;
    font-size:clamp(40px, 10vw, 64px); letter-spacing:.02em; line-height:1.05;
    background:linear-gradient(105deg, #c9a0ff 0%, #b26bff 25%, #ff6bd6 55%, #6be0ff 85%, #c9a0ff 100%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-fill-color:transparent;
    animation: titleShine 5s linear 2s infinite;
    filter:drop-shadow(0 0 30px rgba(178,107,255,.35));
  }
  #welcomeScreen.intro .intro-sub{
    opacity:0; animation:fadeUp .8s ease 1.85s forwards;
    color:var(--text-dim); font-size:clamp(13px, 2.8vw, 15px);
    max-width:340px; margin:10px auto 0; line-height:1.55;
  }
  #welcomeScreen.intro .intro-cta{
    opacity:0; animation:fadeUp .8s ease 2.15s forwards;
    margin-top:10px; z-index:3;
    border-radius:999px; padding:14px 40px; font-size:15px; font-weight:700;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    color:#0a0a12; border:none; cursor:pointer; font-family:inherit;
    box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 12px 40px rgba(178,107,255,.4);
    transition:transform .2s, box-shadow .2s;
  }
  #welcomeScreen.intro .intro-cta:hover{
    transform:translateY(-3px) scale(1.04);
    box-shadow:0 0 0 1px rgba(255,255,255,.2), 0 16px 48px rgba(178,107,255,.55);
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .gate h1{
    font-family:'Poppins','Vazirmatn',sans-serif; font-weight:800; font-size:34px; margin:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .gate p.sub{ color:var(--text-dim); font-size:14px; margin:0; max-width:340px; }
  .gate-choices{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .gate-choice{
    background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:14px;
    padding:18px 26px; font-size:14px; cursor:pointer; font-family:inherit; min-width:150px;
    display:flex; flex-direction:column; gap:6px; align-items:center; transition:all .18s;
  }
  .gate-choice:hover{
    border-color:var(--accent); background:var(--card-hover); transform:translateY(-3px);
    box-shadow:var(--shadow);
  }
  .gate-choice .emoji{ font-size:26px; }
  /* cinematic role gate */
  #roleGate{
    background:
      radial-gradient(circle at 20% 20%, rgba(178,107,255,.22), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,107,214,.16), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(107,224,255,.08), transparent 50%),
      var(--bg);
    overflow:hidden;
  }
  #roleGate::before{
    content:''; position:absolute; inset:-20%;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(178,107,255,.03) 60px, rgba(178,107,255,.03) 61px),
      repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(178,107,255,.03) 60px, rgba(178,107,255,.03) 61px);
    animation: gateGrid 28s linear infinite;
    pointer-events:none;
  }
  @keyframes gateGrid{ to{ transform:translate(-30px,-30px); } }
  #roleGate .gate-cat{
    width:110px; height:110px;
    filter:drop-shadow(0 0 28px rgba(178,107,255,.65)) drop-shadow(0 0 48px rgba(255,107,214,.25));
    animation:catbounce 2.4s ease-in-out infinite, gateCatIn .9s ease-out both;
  }
  @keyframes gateCatIn{
    from{ opacity:0; transform:scale(.4) translateY(30px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }
  #roleGate h1{
    font-size:clamp(36px, 8vw, 52px);
    letter-spacing:.5px;
    animation:fadein .7s ease .15s both;
  }
  #roleGate .sub{
    font-size:15px; max-width:380px; line-height:1.5;
    animation:fadein .7s ease .3s both;
  }
  #roleGate .gate-choices{ animation:fadein .7s ease .45s both; gap:16px; }
  #roleGate .gate-choice{
    min-width:170px; padding:22px 28px; border-radius:18px;
    background:linear-gradient(160deg, color-mix(in srgb,var(--card) 90%,var(--accent)), var(--card));
    border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    position:relative; overflow:hidden;
  }
  #roleGate .gate-choice::after{
    content:''; position:absolute; inset:0; background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.08), transparent 70%);
    transform:translateX(-120%); transition:transform .5s ease;
  }
  #roleGate .gate-choice:hover::after{ transform:translateX(120%); }
  #roleGate .gate-choice:hover{
    transform:translateY(-6px) scale(1.03);
    box-shadow:0 16px 40px rgba(178,107,255,.35);
    border-color:var(--accent);
  }
  #roleGate .gate-choice .emoji{ font-size:34px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
  #roleGate .login-box{
    animation:fadein .4s ease both;
    background:color-mix(in srgb,var(--card) 85%,transparent);
    border:1px solid var(--line); border-radius:16px; padding:18px;
    backdrop-filter:blur(10px); max-width:300px;
  }
  .gate-glow-ring{
    position:absolute; width:220px; height:220px; border-radius:50%;
    border:1px solid rgba(178,107,255,.2);
    animation:ringPulse 3.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes ringPulse{
    0%,100%{ transform:scale(.85); opacity:.4; }
    50%{ transform:scale(1.15); opacity:.15; }
  }
  .login-box{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px; }
  .login-box input{
    background:color-mix(in srgb,var(--bg) 70%,#000); border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:11px; font-size:13px; font-family:inherit;
  }
  .login-box input:focus{ outline:none; border-color:var(--accent); }
  .login-box button{
    background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0a0a12; border:none;
    border-radius:9px; padding:11px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .login-box .back{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
  .gate-error{ color:var(--amber); font-size:12px; min-height:14px; }
  .welcome-enter{
    background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0a0a12; border:none;
    border-radius:999px; padding:12px 30px; font-size:14px; font-weight:700; cursor:pointer;
    font-family:inherit; opacity:0; animation:fadein .6s ease 2.2s forwards;
  }
  @keyframes fadein{ to{ opacity:1; } }
  .welcome-title{ opacity:0; animation:fadein .7s ease 1.6s forwards; }
  .welcome-sub{ opacity:0; animation:fadein .7s ease 1.9s forwards; }

  #app{ display:none; position:relative; z-index:1; }
  header.top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    margin-bottom:22px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .cat-logo{
    width:46px; height:46px; flex-shrink:0;
    filter:drop-shadow(0 0 10px rgba(178,107,255,.5));
  }
  .cat-logo .eye{ transform-origin:center; animation:blink 5.5s ease-in-out infinite; }
  .brand h1{
    margin:0; font-family:'Poppins','Vazirmatn',sans-serif; font-weight:800; font-size:26px; letter-spacing:.3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand .tagline{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .brand .underline{
    width:42px; height:3px; margin-top:6px; border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    opacity:.85;
  }
  .mode-area{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .icon-chip{
    background:transparent; border:1px solid var(--line); color:var(--text-dim);
    border-radius:999px; padding:8px 12px; font-size:12px; cursor:pointer; font-family:inherit;
    transition:all .15s;
  }
  .icon-chip:hover{ border-color:var(--accent); color:var(--accent); }
  .mode-badge{
    font-size:11px; padding:6px 12px; border-radius:999px; font-weight:600;
    display:flex; align-items:center; gap:5px;
  }
  .mode-badge.viewer{ background:color-mix(in srgb,var(--text-dim) 12%,transparent); color:var(--text-dim); border:1px solid var(--line); }
  .mode-badge.admin{ background:color-mix(in srgb,var(--green) 12%,transparent); color:var(--green); border:1px solid var(--green); }
  .admin-btn{
    background:transparent; border:1px solid var(--line); color:var(--text-dim);
    border-radius:999px; padding:8px 14px; font-size:12px; cursor:pointer; font-family:inherit; transition:all .15s;
  }
  .admin-btn:hover{ border-color:var(--accent); color:var(--accent); }

  nav.tabs{
    display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;
  }
  nav.tabs button{
    flex:0 0 auto; background:var(--panel); backdrop-filter:blur(6px); border:1px solid var(--line);

<script>
/* =========================================================
   SUPABASE SETUP — fill these in before deploying.
   1) Create a project at https://supabase.com
   2) Table editor > New table > name it "meowchive_data" with columns:
        id  (int8, primary key, default 1)
        items (jsonb, default [])
      Insert one row with id = 1 (leave items as [])
   3) Database > Replication > enable Realtime for "meowchive_data"
   4) Authentication > Providers > make sure Email is enabled
   5) Authentication > Users > Add user (this becomes your admin login)
   6) Authentication > Policies (on meowchive_data) > add:
        - SELECT: using (true)                     -- public read
        - INSERT/UPDATE/DELETE: using (auth.uid() is not null)  -- signed-in only
   7) Project Settings > API > copy the Project URL and anon public key below

   NEW — for voting + suggestions:
   8) Table editor > New table > "meowchive_votes":
        id (int8, primary key, identity), item_id (text), vote (text),
        voter_id (text), created_at (timestamptz, default now())
      Add a UNIQUE constraint on (item_id, voter_id) so re-voting updates
      instead of duplicating (Table editor > this table > ... > add constraint,
      or SQL editor: alter table meowchive_votes add constraint uniq_vote
      unique (item_id, voter_id);)
      Enable Realtime for this table too.
      Policies: SELECT using (true)   -- public read of vote counts only.
                Do NOT add public INSERT/UPDATE/DELETE policies — instead,
                run this in the SQL Editor so all writes go through a
                controlled function instead of raw table access:

        create or replace function cast_vote(p_item_id text, p_vote text, p_voter_id text)
        returns void language plpgsql security definer set search_path = public as $$
        begin
          if p_vote not in ('up','down') then raise exception 'invalid vote'; end if;
          if p_item_id is null or p_voter_id is null or length(p_voter_id) < 5 then
            raise exception 'invalid parameters';
          end if;
          insert into meowchive_votes (item_id, vote, voter_id)
          values (p_item_id, p_vote, p_voter_id)
          on conflict (item_id, voter_id)
          do update set vote = excluded.vote, created_at = now();
        end; $$;

        create or replace function remove_vote(p_item_id text, p_voter_id text)
        returns void language plpgsql security definer set search_path = public as $$
        begin
          delete from meowchive_votes where item_id = p_item_id and voter_id = p_voter_id;
        end; $$;

        grant execute on function cast_vote(text,text,text) to anon, authenticated;

/* ---------------- link/url safety ----------------
   Only allow http(s) links to be rendered as clickable/openable.
   Blocks javascript:, data:, vbscript: etc. from being used as an
   href even if such a value ever ends up in the stored data. */
function isSafeHref(url){
  if(!url) return false;
  try{
    const u = new URL(String(url).trim(), location.href);
    return u.protocol === 'http:' || u.protocol === 'https:';
  }catch(e){ return false; }
}
function isSafeImageSrc(url){
  if(!url) return false;
  const v = String(url).trim();
  if(/^data:image\//i.test(v)) return true;
  try{
    const u = new URL(v, location.href);
    return u.protocol === 'http:' || u.protocol === 'https:';
  }catch(e){ return false; }
}

let voterId = localStorage.getItem('meow_voter_id');
if(!voterId){
  voterId = 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
  localStorage.setItem('meow_voter_id', voterId);
}
let votesByItem = {}; // { itemId: { up:n, down:n, mine:'up'|'down'|null } }

function tallyVotes(rows){
  const map = {};
  (rows||[]).forEach(r=>{
    if(!map[r.item_id]) map[r.item_id] = { up:0, down:0, mine:null };
    if(r.vote === 'up') map[r.item_id].up++;
    else if(r.vote === 'down') map[r.item_id].down++;
    if(r.voter_id === voterId) map[r.item_id].mine = r.vote;
  });
  return map;
}
async function loadVotes(){
  const { data, error } = await sb.from('meowchive_votes').select('item_id,vote,voter_id');
  if(error){ console.error('votes load error:', error.message); return; }
  votesByItem = tallyVotes(data);
  render();
}
loadVotes();
sb.channel('meowchive-votes-live')
  .on('postgres_changes', { event:'*', schema:'public', table:'meowchive_votes' }, ()=>{ loadVotes(); })
  .subscribe();

async function castVote(itemId, val){
  const current = votesByItem[itemId] || {};
  const newVal = current.mine === val ? null : val; // clicking the same vote again removes it
  try{
    if(newVal === null){
      const { error } = await sb.rpc('remove_vote', { p_item_id: itemId, p_voter_id: voterId });
      if(error) throw error;
    } else {
      const { error } = await sb.rpc('cast_vote', { p_item_id: itemId, p_vote: newVal, p_voter_id: voterId });
      if(error) throw error;
    }
  }catch(e){
    console.error('vote error:', e.message);
    showToast(t('voteFail') || ('⚠️ ' + e.message));
  }
}

async function saveItems(){
  if(!initialLoadSucceeded){
    showToast(locale==='fa'
      ? '⚠️ هنوز داده‌های اصلی لود نشده — صفحه را رفرش کن و دوباره امتحان کن'
      : '⚠️ Original data hasn\'t loaded yet — refresh the page and try again');
    return false;
  }
  try{
    // Conflict check: re-read the current server state right before writing.
    // If it no longer matches what we last synced, someone else changed it
    // in the meantime (another admin, another tab) — refuse to blindly
    // overwrite their changes.
    const { data: current, error: readErr } = await sb.from('meowchive_data').select('items').eq('id', 1).single();
    if(readErr) throw readErr;
    const serverJSON = JSON.stringify((current && current.items) || []);
    if(lastSyncedItemsJSON !== null && serverJSON !== lastSyncedItemsJSON){
      showToast(locale==='fa'
        ? '⚠️ داده روی سرور توسط شخص دیگری تغییر کرده — صفحه را رفرش کن و دوباره تلاش کن'
        : '⚠️ Data changed on the server by someone else — refresh and try again');
      items = (current && current.items) || [];
      lastSyncedItemsJSON = serverJSON;
      render();
      return false;
    }
    const { error } = await sb.from('meowchive_data').update({ items }).eq('id', 1);
    if(error) throw error;
    lastSyncedItemsJSON = JSON.stringify(items);
    return true;
  }catch(e){
    console.error(e);
    showToast(t('saveFail') + ': ' + (e.message || e));
    return false;
  }
}

function startIntroParticles(){
  const canvas = document.getElementById('introCanvas');
  if(!canvas || canvas._running) return;
  canvas._running = true;
  const ctx = canvas.getContext('2d');
  let w, h, particles, raf;
  function resize(){
    w = canvas.width = window.innerWidth * devicePixelRatio;
    h = canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth+'px';
    canvas.style.height = window.innerHeight+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  function spawn(){
    particles = Array.from({length: 70}, ()=>({
      x: Math.random()*window.innerWidth,
      y: Math.random()*window.innerHeight,
      r: Math.random()*1.8 + 0.4,
      vx: (Math.random()-.5)*0.25,
      vy: (Math.random()-.5)*0.25 - 0.08,
      a: Math.random()*0.5 + 0.15,
      hue: Math.random()>.5 ? 280 : 320
    }));
  }
  function tick(){
    if(document.getElementById('welcomeScreen').style.display === 'none'){
      cancelAnimationFrame(raf); canvas._running=false; return;
    }
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    // soft center glow
    const g = ctx.createRadialGradient(window.innerWidth/2, window.innerHeight*0.42, 0, window.innerWidth/2, window.innerHeight*0.42, window.innerWidth*0.35);
    g.addColorStop(0, 'rgba(178,107,255,0.12)');
    g.addColorStop(0.5, 'rgba(255,107,214,0.04)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,window.innerWidth,window.innerHeight);
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      if(p.x<0) p.x=window.innerWidth; if(p.x>window.innerWidth) p.x=0;
      if(p.y<0) p.y=window.innerHeight; if(p.y>window.innerHeight) p.y=0;
      ctx.beginPath();
      ctx.fillStyle = 'hsla('+p.hue+',90%,75%,'+p.a+')';
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    // connecting lines near center
    const cx = window.innerWidth/2, cy = window.innerHeight*0.42;
    for(let i=0;i<particles.length;i++){
      const a = particles[i];
      const da = Math.hypot(a.x-cx, a.y-cy);
      if(da>160) continue;
      for(let j=i+1;j<particles.length;j++){
        const b = particles[j];
        const d = Math.hypot(a.x-b.x, a.y-b.y);
        if(d<90){
          ctx.strokeStyle = 'rgba(178,107,255,'+(0.12*(1-d/90))+')';
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(tick);
  }
  resize(); spawn(); tick();
  window.addEventListener('resize', ()=>{ resize(); });
}

document.addEventListener('mousemove', (e)=>{
  const eye = document.getElementById('watchEye');
  if(!eye) return;
  eye.querySelectorAll('.ball').forEach(ball=>{
    const r = ball.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const dx = e.clientX - cx, dy = e.clientY - cy;
    const max = 2.4;
    const dist = Math.min(max, Math.hypot(dx,dy)/40);
    const ang = Math.atan2(dy, dx);
    const px = Math.cos(ang) * dist, py = Math.sin(ang) * dist;
    const pupil = ball.querySelector('.pupil');
    if(pupil) pupil.style.transform = 'translate(calc(-50% + '+px+'px), calc(-50% + '+py+'px))';
  });
});

function buildTabs(){
  const nav = document.getElementById('mainTabs'); nav.innerHTML = '';
  CAT_ORDER.forEach(key=>{
    const b = document.createElement('button');

    b.innerHTML = '<span class="tab-ico">'+CATS[key].icon+'</span> ' + tCat(key);
    b.className = key===currentCat ? 'active' : '';

    nav.appendChild(b);
  });
  fixTabScrollOnce();
}
let tabScrollFixed = false;
function fixTabScrollOnce(){
  // Browsers are inconsistent about initial horizontal-scroll position in
  // RTL layouts, which can leave the first tab scrolled out of view even
  // though it's correctly first in the markup. Force it into view — but
  // only once, so we don't yank the tab bar back if someone deliberately
  // scrolled it to see a later tab.
  if(tabScrollFixed) return;
  const nav = document.getElementById('mainTabs');
  if(nav.firstElementChild){
    nav.firstElementChild.scrollIntoView({ block:'nearest', inline:'start' });
    tabScrollFixed = true;
  }
}
function buildSubTabs(){
  const st = document.getElementById('subTabs');
  if(!hasSub(currentCat)){ st.style.display='none'; return; }
  st.style.display='flex'; st.innerHTML='';
  subsOf(currentCat).forEach(s=>{

    b.textContent=tSub(s.key); b.className = currentSub===s.key?'active':'';
    b.onclick=()=>{ currentSub=s.key; render(); };
    st.appendChild(b);
  });
}
function currentItems(){
  let list = currentCat === 'all' ? items.slice() : items.filter(it=>it.cat===currentCat);
  if(hasSub(currentCat)) list = list.filter(it=>it.sub===currentSub);
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  if(q) list = list.filter(it=>(it.title||'').toLowerCase().includes(q) || (it.note||'').toLowerCase().includes(q));
  const sortBy = document.getElementById('sortSel').value;
  // filters (narrow list)
  if(sortBy==='tested') list = list.filter(it=>!!it.tested);
  else if(sortBy==='free') list = list.filter(it=>it.sub==='free' || /free|رایگان/i.test(it.note||'') || /free|رایگان/i.test(it.title||''));
  else if(sortBy==='paid') list = list.filter(it=>it.sub==='paid' || /paid|پولی|premium/i.test(it.note||'') || /paid|پولی/i.test(it.title||''));
  // sorts
  if(sortBy==='rating') list.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if(sortBy==='low') list.sort((a,b)=>(a.rating||0)-(b.rating||0));
  else if(sortBy==='az') list.sort((a,b)=>a.title.localeCompare(b.title, locale==='fa'?'fa':'en'));
  else if(sortBy==='new' || sortBy==='tested' || sortBy==='free' || sortBy==='paid') list.sort((a,b)=>(b.ts||0)-(a.ts||0));
  else list.sort((a,b)=>(b.ts||0)-(a.ts||0));
  return list;
}

async function copyPrompt(id, idx){
  const it = items.find(x=>x.id===id); if(!it) return;
  const list = (it.promptTexts && it.promptTexts.length) ? it.promptTexts : (it.promptText ? [{label:'',text:it.promptText}] : []);
  const entry = list[parseInt(idx)||0]; if(!entry || !entry.text) return;
  try{ await navigator.clipboard.writeText(entry.text); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=entry.text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e2){} ta.remove();
  }
  showToast(t('copied'));
}

function debounce(fn, ms){
  let h;
  return (...args)=>{ clearTimeout(h); h=setTimeout(()=>fn(...args), ms); };
}

  const testedWrap = overlay.querySelector('#f_tested');
  testedWrap.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{ testedVal = btn.getAttribute('data-val')==='1'; testedWrap.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===btn)); };
  });

  const catSel = overlay.querySelector('#f_cat');
  catSel.onchange = ()=>{
    const c = catSel.value;
    const subWrap = overlay.querySelector('#f_sub_wrap');
    subWrap.style.display = hasSub(c) ? 'flex':'none';
    if(hasSub(c)){ overlay.querySelector('#f_sub').innerHTML = subsOf(c).map(s=>`<option value="${s.key}">${tSub(s.key)}</option>`).join(''); }
  };

  overlay.querySelector('#f_cancel').onclick = ()=> overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };

  overlay.querySelector('#f_save').onclick = async ()=>{
    const title = overlay.querySelector('#f_title').value.trim();
    if(!title){ showToast(t('needTitle')); return; }
    const c = catSel.value;
    const rawLinks = Array.from(overlay.querySelectorAll('.link-input')).map(i=>i.value.trim()).filter(Boolean);
    const links = rawLinks.filter(isSafeHref);
    if(rawLinks.length !== links.length){ showToast(locale==='fa' ? 'یک یا چند لینک نامعتبر بود و حذف شد' : 'One or more links were invalid and were removed'); }
    const rawImage = overlay.querySelector('#f_image').value.trim();
    const safeImage = (!rawImage || isSafeImageSrc(rawImage)) ? rawImage : '';
    const promptTexts = Array.from(promptsWrap.children).map(row=>({ label: row.querySelector('.prompt-label').value.trim(), text: row.querySelector('.prompt-text').value.trim() })).filter(p=>p.text);
    const noteTexts = Array.from(notesWrap.children).map(row=>({ label: row.querySelector('.note-label').value.trim(), text: row.querySelector('.note-text').value.trim() })).filter(n=>n.text);
    const noteJoined = noteTexts.map(n=>n.label? (n.label+': '+n.text):n.text).join('\n\n');
    const payload = { cat:c, sub: hasSub(c) ? overlay.querySelector('#f_sub').value : undefined, title, links, image: safeImage, note: noteJoined, noteTexts, promptTexts, tested: testedVal, rating: rateVal };
    const saveBtn = overlay.querySelector('#f_save');
    saveBtn.textContent = '...'; saveBtn.disabled = true;
    const backup = existing ? Object.assign({}, existing) : null;
    if(existing){ Object.assign(existing, payload); } else { items.push(Object.assign({ id: uid(), ts: Date.now() }, payload)); }
    const ok = await saveItems();
    if(!ok){
      if(existing && backup){ Object.assign(existing, backup); } else { items.pop(); }
      saveBtn.textContent = existing ? t('saveChanges') : t('addNew'); saveBtn.disabled = false;
      return;
    }
    currentCat = c; if(hasSub(c)) currentSub = payload.sub;
    overlay.remove(); render();
    showToast(existing ? t('saved') : t('added'));
  };
}

/* ---------------- suggest-something modal (everyone) ---------------- */
document.getElementById('suggestBtn').onclick = ()=>{
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>💡 ${locale==='fa' ? 'یه چیزی پیشنهاد بده' : 'Suggest something'}</h2>
      <label>${locale==='fa' ? 'یه ابزار، ترفند، یا هرچی که فکر می‌کنی باید اینجا باشه رو بنویس' : "A tool, trick, or anything you think belongs here"}
        <textarea id="sugg_text" dir="auto" rows="5" placeholder="${locale==='fa' ? 'مثلاً: فلان سایت رو تست کن، یا فلان ترفند رو اضافه کن' : 'e.g. try this site, or add this trick'}"></textarea>
      </label>
      <div class="modal-actions">
        <button id="sugg_cancel">${locale==='fa' ? 'انصراف' : 'Cancel'}</button>
        <button class="save" id="sugg_submit">${locale==='fa' ? 'ارسال' : 'Send'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('paste', e=>{
    if(e.target.tagName !== 'TEXTAREA') return;
    e.preventDefault();
    const raw = (e.clipboardData || window.clipboardData).getData('text/plain');
    const cleaned = cleanPastedText(raw);
    const el = e.target, start = el.selectionStart, end = el.selectionEnd, val = el.value;
    el.value = val.slice(0,start) + cleaned + val.slice(end);
    el.selectionStart = el.selectionEnd = start + cleaned.length;
  });
  overlay.querySelector('#sugg_cancel').onclick = ()=> overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#sugg_submit').onclick = async ()=>{
    const val = overlay.querySelector('#sugg_text').value;
    if(!val.trim()){ showToast(locale==='fa' ? 'یه متنی بنویس' : 'Write something first'); return; }
    const btn = overlay.querySelector('#sugg_submit');
    btn.disabled = true; btn.textContent = '...';
    const ok = await submitSuggestion(val);
    if(ok){ overlay.remove(); showToast(locale==='fa' ? 'فرستاده شد، مرسی! 🐾' : 'Sent, thank you! 🐾'); }
    else { btn.disabled = false; btn.textContent = locale==='fa' ? 'ارسال' : 'Send'; }
  };
};

/* ---------------- inbox modal (admin only — button itself is hidden for viewers) ---------------- */
document.getElementById('inboxBtn').onclick = async ()=>{
  if(!isAdmin) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>📥 ${locale==='fa' ? 'پیشنهادهای کاربرا' : 'User suggestions'}</h2>
      <div id="inbox_list" style="display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;">
        <div class="hint">${locale==='fa' ? 'در حال بارگذاری...' : 'Loading...'}</div>
      </div>
      <div class="modal-actions"><button id="inbox_close">${locale==='fa' ? 'بستن' : 'Close'}</button></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#inbox_close').onclick = ()=> overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };

  const rows = await loadSuggestions();
  const list = overlay.querySelector('#inbox_list');
  if(!rows.length){
    list.innerHTML = `<div class="hint">${locale==='fa' ? 'هنوز پیشنهادی نیومده.' : 'No suggestions yet.'}</div>`;
    return;
  }
  list.innerHTML = rows.map(r=>`
    <div class="promptrow" data-row-id="${r.id}">
      <div class="promptbox-text" dir="auto" style="white-space:pre-wrap;">${escapeHtml(r.text)}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="hint">${new Date(r.created_at).toLocaleString(locale==='fa'?'fa-IR':'en-US')}</span>
        <button class="del-suggestion" data-id="${r.id}">${locale==='fa' ? 'حذف' : 'Delete'}</button>
      </div>
    </div>`).join('');
  list.querySelectorAll('.del-suggestion').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.getAttribute('data-id');
      await deleteSuggestion(id);
      const row = list.querySelector(`[data-row-id="${id}"]`);
      if(row) row.remove();
      if(!list.querySelector('[data-row-id]')){
        list.innerHTML = `<div class="hint">${locale==='fa' ? 'هنوز پیشنهادی نیومده.' : 'No suggestions yet.'}</div>`;
      }
    };
  });
};

/* -------- boot: visitors skip role gate; admin is secret -------- */
(async function bootFlow(){
  // Resolve any existing Supabase session up front (fixes: reload used to
  // lose admin status and always show the welcome screen from scratch).
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.user){
      const email = (data.session.user.email || '').toLowerCase();
      if(!ADMIN_EMAIL || email === ADMIN_EMAIL.toLowerCase()){
        isAdmin = true;
      }
    }
  }catch(e){ console.error('getSession failed:', e); }

  sb.auth.onAuthStateChange((event, session)=>{
    if(session && session.user){
      const email = (session.user.email || '').toLowerCase();
      if(ADMIN_EMAIL && email !== ADMIN_EMAIL.toLowerCase()){
        sb.auth.signOut();
        isAdmin = false;
        return;
      }
      isAdmin = true;
      if(appEntered) updateModeUI();
    } else {
      isAdmin = false;
      if(appEntered) updateModeUI();
    }
  });

  // URL secret: meowchive.html#admin  or  ?admin=1
  const wantAdmin = location.hash === '#admin' || /[?&]admin=1(?:&|$)/.test(location.search);
  history.replaceState({view:'welcome'}, '', location.pathname);
  if(wantAdmin){
    document.getElementById('welcomeScreen').style.display = 'none';
    openAdminLogin();
    return;
  }

  // Already entered earlier in this browser tab? Skip straight back in
  // instead of forcing the welcome screen again on every reload.
  if(sessionStorage.getItem('meow_entered') === '1'){
    document.getElementById('roleGate').style.display = 'none';
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    appEntered = true;
    history.pushState({view:'app'}, '', location.pathname);
    updateModeUI();
    return;
  }

  // normal visitors: welcome as viewer
  document.getElementById('roleGate').style.display = 'none';
  document.getElementById('welcomeScreen').style.display = 'flex';
  document.getElementById('welcomeSub').textContent = t('tagline');
  playWelcomeCat();
})();

}

/* secret: 5 quick clicks on welcome cat opens admin login */
(function secretAdminClicks(){
  let n = 0, t0 = 0;
  document.addEventListener('click', (e)=>{
    const cat = e.target.closest && e.target.closest('#welcomeCat, .welcome-cat-wrap, #roleGate .gate-cat');
    if(!cat) return;
    const now = Date.now();
    if(now - t0 > 2500) n = 0;
    t0 = now;
    n++;
    if(n >= 5){
      n = 0;
      openAdminLogin();
      showToast(locale==='fa' ? 'ورود ادمین' : 'Admin unlock');
    }
  });
})();

/* secret keyboard: press A three times quickly while on welcome */
(function secretAdminKeys(){
  let n = 0, t0 = 0;
  document.addEventListener('keydown', (e)=>{
    if(document.getElementById('app').style.display === 'block') return;
    if(e.key !== 'a' && e.key !== 'A' && e.key !== 'ش') return;
    const now = Date.now();
    if(now - t0 > 1500) n = 0;
    t0 = now;
    n++;
    if(n >= 3){
      n = 0;
      openAdminLogin();
    }
  });
})();
